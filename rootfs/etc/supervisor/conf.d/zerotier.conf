[program:zerotier]
command=/usr/sbin/zerotier-one
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:zt-join]
command=/usr/local/bin/zt-join.sh
autostart=true
autorestart=false
startsecs=0
priority=6
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
