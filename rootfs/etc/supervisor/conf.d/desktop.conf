[program:xvnc]
command=/usr/bin/Xtigervnc :1 -geometry %(ENV_VNC_RESOLUTION)s -depth 24 -rfbport 5901 -SecurityTypes VncAuth -PasswordFile /home/ipmi/.vnc/passwd -AlwaysShared -localhost no
user=ipmi
environment=HOME="/home/ipmi"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=/bin/bash -c 'sleep 2 && exec /usr/bin/startfluxbox'
user=ipmi
environment=HOME="/home/ipmi",DISPLAY=":1",USER="ipmi"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5901
user=ipmi
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
